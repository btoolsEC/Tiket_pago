<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 10px;
        }

        .btn-print {
            padding: 12px 30px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14pt;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }

        .btn-print:hover {
            background-color: #45a049;
        }

        .ticket {
            width: 80mm;
            background-color: white;
            padding: 4mm;
            box-sizing: border-box;
            border: 0.1mm solid #ddd;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .header {
            text-align: center;
            border-bottom: 1px dashed #000;
            padding-bottom: 3mm;
            margin-bottom: 3mm;
        }

        .header h1 {
            margin: 0;
            font-size: 18pt;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header p {
            margin: 1mm 0;
            font-size: 9pt;
            color: #555;
        }

        .titulo-ticket {
            text-align: center;
            font-size: 11pt;
            font-weight: bold;
            margin-bottom: 3mm;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dato {
            display: flex;
            justify-content: space-between;
            font-size: 10pt;
            margin: 2mm 0;
        }

        .dato .label {
            font-weight: bold;
            color: #333;
        }

        .dato .valor {
            text-align: right;
            color: #000;
        }

        .divider {
            border: none;
            border-top: 1px dashed #000;
            margin: 3mm 0;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 13pt;
            font-weight: bold;
            margin: 2mm 0;
        }

        .footer {
            border-top: 1px dashed #000;
            padding-top: 3mm;
            margin-top: 3mm;
            text-align: center;
        }

        .footer p {
            margin: 1mm 0;
            font-size: 9pt;
            color: #555;
        }

        .footer .btoolsec {
            font-size: 8pt;
            color: #aaa;
            margin-top: 2mm;
        }

        .status {
            font-size: 10pt;
            color: #333;
            text-align: center;
            max-width: 300px;
            line-height: 1.4;
            padding: 8px;
            border-radius: 6px;
            background-color: #fff;
            border: 1px solid #ddd;
        }

        /* --- REGLAS EXCLUSIVAS PARA IMPRESIÓN --- */
        @media print {
            body {
                background-color: #fff;
                display: block; /* Desactiva flexbox para evitar desajustes en el papel */
                min-height: auto;
                padding: 0;
                margin: 0;
            }

            /* Oculta por completo el botón y los mensajes de estado */
            .btn-print, .status {
                display: none !important;
            }

            /* Ajusta el ticket para que se adapte perfectamente al ancho del papel térmico */
            .ticket {
                width: 100% !important;
                max-width: 80mm;
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <p class="status" id="status">Iniciando servicio de impresión...</p>
    <button class="btn-print" id="btnManual" style="display:none" onclick="imprimirManual()">🖨️ Imprimir Manual (Ctrl+P)</button>

    <div class="ticket" id="ticket">
        <div class="header">
            <h1>MADELU</h1>
            <p>Comprobante de Pago</p>
        </div>

        <div class="titulo-ticket">Registro de Abono</div>

        <div class="dato">
            <span class="label">Nombre:</span>
            <span class="valor" id="nombre"></span>
        </div>

        <div class="dato">
            <span class="label">Fecha:</span>
            <span class="valor" id="fecha"></span>
        </div>

        <div class="dato">
            <span class="label">Forma de Pago:</span>
            <span class="valor" id="formapago"></span>
        </div>

        <hr class="divider">

        <!-- Primero se muestra el Abono realizado -->
        <div class="total">
            <span>ABONO:</span>
            <span id="abono"></span>
        </div>

        <hr class="divider">

        <!-- Después se muestra el Saldo Actual resultante -->
        <div class="dato">
            <span class="label">Saldo Actual:</span>
            <span class="valor" id="saldoactual"></span>
        </div>

        <div class="footer">
            <p>¡Gracias por su pago!</p>
            <p class="btoolsec">App desarrollada por BtoolsEC</p>
        </div>
    </div>

    <!-- QZ Tray -->
    <script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.js"></script>

    <script>
        // Obtener parámetros de la URL enviados desde AppSheet
        const params = new URLSearchParams(window.location.search);
        
        const nombre = params.get('nombre') || 'N/D';
        const fecha = params.get('fecha') || 'N/D';
        const formapago = params.get('formapago') || 'N/D';
        const abono = params.get('abono') || '0.00';
        const saldoactual = params.get('saldoactual') || '0.00';

        // Pintar los datos en el ticket visual sin concatenar el signo de dólar duplicado
        document.getElementById('nombre').textContent = nombre;
        document.getElementById('fecha').textContent = fecha;
        document.getElementById('formapago').textContent = formapago;
        document.getElementById('saldoactual').textContent = saldoactual;
        document.getElementById('abono').textContent = abono;

        function imprimirManual() {
            window.print();
        }

        window.onload = async function() {
            // Manejador global para suprimir las alertas de consola en entornos con restricciones WebSocket
            const originalConsoleError = console.error;
            console.error = function(...args) {
                if (args[0] && (args[0].toString().includes("WebSocket") || args[0].toString().includes("SecurityError"))) {
                    return; 
                }
                originalConsoleError.apply(console, args);
            };

            try {
                document.getElementById('status').innerHTML = 'Conectando con <strong>QZ Tray</strong> local...';

                // Intentar conectar con QZ Tray con un tiempo límite de 8 segundos
                await Promise.race([
                    qz.websocket.connect(),
                    new Promise((_, reject) => setTimeout(() => reject(new Error("La conexión tardó demasiado")), 8000))
                ]);

                document.getElementById('status').innerHTML = '✅ Impresora conectada. Enviando ticket...';

                // Configurar la impresora con el nombre exacto registrado en tu sistema ("POSPrinter POS80")
                const config = qz.configs.create("POSPrinter POS80");

                // Construcción de comandos ESC/POS para la ticketera física (Abono primero, Saldo Actual después)
                const data = [
                    "\x1B\x40",           // Resetear impresora
                    "\x1B\x61\x01",       // Centrar texto
                    "\x1B\x21\x30",       // Texto en tamaño grande
                    "MADELU\n",
                    "\x1B\x21\x00",       // Volver a texto normal
                    "Comprobante de Pago\n",
                    "--------------------------------\n",
                    "\x1B\x61\x00",       // Alinear a la izquierda
                    "REGISTRO DE ABONO\n",
                    "--------------------------------\n",
                    "Nombre:  " + nombre + "\n",
                    "Fecha:   " + fecha + "\n",
                    "F. Pago: " + formapago + "\n",
                    "--------------------------------\n",
                    "\x1B\x21\x10",       // Texto con doble ancho para destacar el Abono
                    "ABONO: " + abono + "\n",  // Removido el signo "$" duplicado
                    "\x1B\x21\x00",       // Retornar a texto normal
                    "--------------------------------\n",
                    "S. Act:  " + saldoactual + "\n", // Removido el signo "$" duplicado y movido después del Abono
                    "--------------------------------\n",
                    "\x1B\x61\x01",       // Centrar texto
                    "Gracias por su pago!\n",
                    "App por BtoolsEC\n",
                    "\n\n\n",             // Espaciado para el corte
                    "\x1D\x56\x41\x10"    // Comando físico para cortar el papel
                ];

                // Enviar trabajo a la impresora
                await qz.print(config, data);
                
                // Desconectar ordenadamente de QZ Tray
                await qz.websocket.disconnect();
                document.getElementById('status').innerHTML = '✅ ¡Ticket impreso con éxito!';

            } catch (err) {
                console.warn("Conexión directa a QZ Tray omitida/fallida:", err.message);
                
                // Mensaje amigable si QZ Tray no está abierto en la computadora del usuario
                document.getElementById('status').innerHTML = '⚠️ No se pudo conectar automáticamente con la ticketera.<br><small>Asegúrate de tener QZ Tray abierto en tu computadora y que la impresora "POSPrinter POS80" esté encendida.</small>';
                document.getElementById('btnManual').style.display = 'block';
            }
        }
    </script>

</body>
</html>
