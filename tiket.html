<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 10px;
        }

        .btn-print {
            padding: 10px 30px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14pt;
            cursor: pointer;
        }

        .ticket {
            width: 80mm;
            background-color: white;
            padding: 4mm;
            box-sizing: border-box;
            border: 0.1mm solid #ddd;
        }

        .header {
            text-align: center;
            border-bottom: 1px dashed #000;
            padding-bottom: 3mm;
            margin-bottom: 3mm;
        }

        .header h1 {
            margin: 0;
            font-size: 18pt;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header p {
            margin: 1mm 0;
            font-size: 9pt;
            color: #555;
        }

        .titulo-ticket {
            text-align: center;
            font-size: 11pt;
            font-weight: bold;
            margin-bottom: 3mm;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dato {
            display: flex;
            justify-content: space-between;
            font-size: 10pt;
            margin: 2mm 0;
        }

        .dato .label {
            font-weight: bold;
            color: #333;
        }

        .dato .valor {
            text-align: right;
            color: #000;
        }

        .divider {
            border: none;
            border-top: 1px dashed #000;
            margin: 3mm 0;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 13pt;
            font-weight: bold;
            margin: 2mm 0;
        }

        .footer {
            border-top: 1px dashed #000;
            padding-top: 3mm;
            margin-top: 3mm;
            text-align: center;
        }

        .footer p {
            margin: 1mm 0;
            font-size: 9pt;
            color: #555;
        }

        .footer .btoolsec {
            font-size: 8pt;
            color: #aaa;
            margin-top: 2mm;
        }

        .status {
            font-size: 10pt;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>

    <p class="status" id="status">Conectando con impresora...</p>
    <button class="btn-print" id="btnManual" style="display:none" onclick="imprimirManual()">🖨️ Imprimir Manual</button>

    <div class="ticket" id="ticket">
        <div class="header">
            <h1>MADELU</h1>
            <p>Comprobante de Pago</p>
        </div>

        <div class="titulo-ticket">Registro de Abono</div>

        <div class="dato">
            <span class="label">Nombre:</span>
            <span class="valor" id="nombre"></span>
        </div>

        <div class="dato">
            <span class="label">Fecha:</span>
            <span class="valor" id="fecha"></span>
        </div>

        <div class="dato">
            <span class="label">Forma de Pago:</span>
            <span class="valor" id="formapago"></span>
        </div>

        <!-- Campo Saldo Actual -->
        <div class="dato">
            <span class="label">Saldo Actual:</span>
            <span class="valor" id="saldoactual"></span>
        </div>

        <hr class="divider">

        <div class="total">
            <span>ABONO:</span>
            <span id="abono"></span>
        </div>

        <hr class="divider">

        <div class="footer">
            <p>¡Gracias por su pago!</p>
            <p class="btoolsec">App desarrollada por BtoolsEC</p>
        </div>
    </div>

    <!-- QZ Tray -->
    <script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('nombre').textContent = params.get('nombre') || '';
        document.getElementById('fecha').textContent = params.get('fecha') || '';
        document.getElementById('formapago').textContent = params.get('formapago') || '';
        document.getElementById('abono').textContent = '$ ' + (params.get('abono') || '0.00');
        
        const saldoActualVal = params.get('saldoactual') || '0.00';
        document.getElementById('saldoactual').textContent = '$ ' + saldoActualVal;

        const nombre = params.get('nombre') || '';
        const fecha = params.get('fecha') || '';
        const formapago = params.get('formapago') || '';
        const abono = params.get('abono') || '0.00';
        const saldoactual = saldoActualVal;

        function imprimirManual() {
            window.print();
        }

        window.onload = async function() {
            // Manejador global para prevenir errores no capturados de seguridad de WebSockets en el entorno de desarrollo/Canvas
            const originalConsoleError = console.error;
            console.error = function(...args) {
                if (args[0] && (args[0].toString().includes("WebSocket") || args[0].toString().includes("SecurityError"))) {
                    // Ocultamos de la consola visual el SecurityError repetitivo de WebSockets en modo desarrollo
                    return;
                }
                originalConsoleError.apply(console, args);
            };

            try {
                // Validación para evitar bloqueos del navegador si se ejecuta dentro de un iframe con políticas estrictas de seguridad (Sandbox)
                if (window.location.hostname === "localhost" || window.location.protocol === "file:") {
                    console.log("Modo local o restringido detectado. Intentando conexión segura.");
                }

                document.getElementById('status').textContent = 'Intentando conectar con impresora local...';
                
                // Conectamos con un timeout controlado para evitar esperas infinitas o fallas de seguridad del navegador
                await Promise.race([
                    qz.websocket.connect(),
                    new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout al conectar con QZ Tray")), 4000))
                ]);

                document.getElementById('status').textContent = '✅ Impresora conectada, imprimiendo...';

                const config = qz.configs.create("PR-255");

                const data = [
                    "\x1B\x40",           // Reset impresora
                    "\x1B\x61\x01",       // Centrar
                    "\x1B\x21\x30",       // Texto grande
                    "MADELU\n",
                    "\x1B\x21\x00",       // Texto normal
                    "Comprobante de Pago\n",
                    "--------------------------------\n",
                    "\x1B\x61\x00",       // Izquierda
                    "REGISTRO DE ABONO\n",
                    "--------------------------------\n",
                    "Nombre:  " + nombre + "\n",
                    "Fecha:   " + fecha + "\n",
                    "F. Pago: " + formapago + "\n",
                    "S. Act:  $ " + saldoactual + "\n",
                    "--------------------------------\n",
                    "\x1B\x21\x10",       // Texto doble ancho
                    "ABONO: $ " + abono + "\n",
                    "\x1B\x21\x00",       // Texto normal
                    "--------------------------------\n",
                    "\x1B\x61\x01",       // Centrar
                    "Gracias por su pago!\n",
                    "App por BtoolsEC\n",
                    "\n\n\n",
                    "\x1D\x56\x41\x10"    // Cortar papel
                ];

                await qz.print(config, data);
                await qz.websocket.disconnect();
                document.getElementById('status').textContent = '✅ Impreso correctamente';

            } catch (err) {
                // Captura controlada del error de WebSocket/Seguridad
                console.warn("No se pudo conectar de manera automática con QZ Tray:", err.message);
                document.getElementById('status').textContent = '⚠️ QZ Tray no disponible o bloqueado por seguridad. Usa el botón manual.';
                document.getElementById('btnManual').style.display = 'block';
            }
        }
    </script>

</body>
</html>
