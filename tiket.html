<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 10px;
        }

        .btn-print {
            padding: 12px 30px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14pt;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }

        .btn-print:hover {
            background-color: #45a049;
        }

        .ticket {
            width: 80mm;
            background-color: white;
            padding: 4mm;
            box-sizing: border-box;
            border: 0.1mm solid #ddd;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .header {
            text-align: center;
            border-bottom: 1px dashed #000;
            padding-bottom: 3mm;
            margin-bottom: 3mm;
        }

        .header h1 {
            margin: 0;
            font-size: 18pt;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header p {
            margin: 1mm 0;
            font-size: 9pt;
            color: #555;
        }

        .titulo-ticket {
            text-align: center;
            font-size: 11pt;
            font-weight: bold;
            margin-bottom: 3mm;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dato {
            display: flex;
            justify-content: space-between;
            font-size: 10pt;
            margin: 2mm 0;
        }

        .dato .label {
            font-weight: bold;
            color: #333;
        }

        .dato .valor {
            text-align: right;
            color: #000;
        }

        .divider {
            border: none;
            border-top: 1px dashed #000;
            margin: 3mm 0;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 13pt;
            font-weight: bold;
            margin: 2mm 0;
        }

        .footer {
            border-top: 1px dashed #000;
            padding-top: 3mm;
            margin-top: 3mm;
            text-align: center;
        }

        .footer p {
            margin: 1mm 0;
            font-size: 9pt;
            color: #555;
        }

        .footer .btoolsec {
            font-size: 8pt;
            color: #aaa;
            margin-top: 2mm;
        }

        .status {
            font-size: 10pt;
            color: #333;
            text-align: center;
            max-width: 320px;
            line-height: 1.5;
            padding: 12px;
            border-radius: 6px;
            background-color: #fff;
            border: 1px solid #ddd;
        }

        .diagnostic-box {
            font-size: 8pt;
            color: #d32f2f;
            background-color: #ffebee;
            padding: 8px;
            border-radius: 4px;
            margin-top: 8px;
            text-align: left;
            border-left: 3px solid #f44336;
        }

        /* --- REGLAS EXCLUSIVAS PARA IMPRESIÓN --- */
        @media print {
            body {
                background-color: #fff;
                display: block;
                min-height: auto;
                padding: 0;
                margin: 0;
            }

            .btn-print, .status {
                display: none !important;
            }

            .ticket {
                width: 100% !important;
                max-width: 80mm;
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <div class="status" id="statusBox">
        <span id="statusText">Iniciando servicio de impresión...</span>
        <div id="diagnostic" style="display:none" class="diagnostic-box"></div>
    </div>
    
    <button class="btn-print" id="btnManual" style="display:none" onclick="imprimirManual()">🖨️ Imprimir Manual (Ctrl+P)</button>

    <div class="ticket" id="ticket">
        <div class="header">
            <h1>MADELU</h1>
            <p>Comprobante de Pago</p>
        </div>

        <div class="titulo-ticket">Registro de Abono</div>

        <div class="dato">
            <span class="label">Nombre:</span>
            <span class="valor" id="nombre"></span>
        </div>

        <div class="dato">
            <span class="label">Fecha:</span>
            <span class="valor" id="fecha"></span>
        </div>

        <div class="dato">
            <span class="label">Forma de Pago:</span>
            <span class="valor" id="formapago"></span>
        </div>

        <hr class="divider">

        <!-- Primero se muestra el Abono realizado -->
        <div class="total">
            <span>ABONO:</span>
            <span id="abono"></span>
        </div>

        <hr class="divider">

        <!-- Después se muestra el Saldo Actual resultante -->
        <div class="dato">
            <span class="label">Saldo Actual:</span>
            <span class="valor" id="saldoactual"></span>
        </div>

        <div class="footer">
            <p>¡Gracias por su pago!</p>
            <p class="btoolsec">App desarrollada por BtoolsEC</p>
        </div>
    </div>

    <!-- QZ Tray -->
    <script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.js"></script>

    <script>
        // Obtener parámetros de la URL enviados desde AppSheet
        const params = new URLSearchParams(window.location.search);
        
        const nombre = params.get('nombre') || 'N/D';
        const fecha = params.get('fecha') || 'N/D';
        const formapago = params.get('formapago') || 'N/D';
        const abono = params.get('abono') || '0.00';
        const saldoactual = params.get('saldoactual') || '0.00';

        // Pintar los datos en el ticket visual
        document.getElementById('nombre').textContent = nombre;
        document.getElementById('fecha').textContent = fecha;
        document.getElementById('formapago').textContent = formapago;
        document.getElementById('saldoactual').textContent = saldoactual;
        document.getElementById('abono').textContent = abono;

        function imprimirManual() {
            window.print();
        }

        window.onload = async function() {
            // Manejador global para suprimir alertas redundantes de consola en entornos con restricciones WebSocket
            const originalConsoleError = console.error;
            console.error = function(...args) {
                if (args[0] && (args[0].toString().includes("WebSocket") || args[0].toString().includes("SecurityError"))) {
                    return; 
                }
                originalConsoleError.apply(console, args);
            };

            const statusText = document.getElementById('statusText');
            const diagnosticBox = document.getElementById('diagnostic');
            const btnManual = document.getElementById('btnManual');

            try {
                statusText.innerHTML = 'Conectando con <strong>QZ Tray</strong> local...';

                // Intentar conectar con QZ Tray con un tiempo límite de 8 segundos
                await Promise.race([
                    qz.websocket.connect(),
                    new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout de conexión (8s)")), 8000))
                ]);

                statusText.innerHTML = '✅ Conectado a QZ. Enviando a <strong>POSPrinter POS80</strong>...';

                // Configurar la impresora física
                const config = qz.configs.create("POSPrinter POS80");

                // Comandos ESC/POS para la ticketera
                const data = [
                    "\x1B\x40",           // Resetear impresora
                    "\x1B\x61\x01",       // Centrar texto
                    "\x1B\x21\x30",       // Texto en tamaño grande
                    "MADELU\n",
                    "\x1B\x21\x00",       // Texto normal
                    "Comprobante de Pago\n",
                    "--------------------------------\n",
                    "\x1B\x61\x00",       // Alinear a la izquierda
                    "REGISTRO DE ABONO\n",
                    "--------------------------------\n",
                    "Nombre:  " + nombre + "\n",
                    "Fecha:   " + fecha + "\n",
                    "F. Pago: " + formapago + "\n",
                    "--------------------------------\n",
                    "\x1B\x21\x10",       // Doble ancho para Abono
                    "ABONO: " + abono + "\n",
                    "\x1B\x21\x00",       // Retornar a normal
                    "--------------------------------\n",
                    "S. Act:  " + saldoactual + "\n",
                    "--------------------------------\n",
                    "\x1B\x61\x01",       // Centrar
                    "Gracias por su pago!\n",
                    "App por BtoolsEC\n",
                    "\n\n\n",             // Espacio de corte
                    "\x1D\x56\x41\x10"    // Cortar
                ];

                await qz.print(config, data);
                await qz.websocket.disconnect();
                statusText.innerHTML = '✅ ¡Ticket impreso correctamente!';

            } catch (err) {
                console.warn("Error de enlace QZ:", err.message);
                
                statusText.innerHTML = '⚠️ <strong>QZ Tray no responde</strong>';
                btnManual.style.display = 'block';
                
                // Mostrar caja de diagnóstico para ayudarte a encontrar la falla local
                diagnosticBox.style.display = 'block';
                diagnosticBox.innerHTML = `
                    <strong>Guía de solución rápida:</strong><br>
                    • Asegúrate de que el programa <strong>QZ Tray</strong> esté abierto en tu PC (icono "Q" verde).<br>
                    • Abre una pestaña e ingresa a <a href="https://localhost:8183" target="_blank" style="color:#d32f2f; font-weight:bold;">https://localhost:8183</a> para aprobar el certificado de seguridad de Windows si el navegador lo bloqueó.<br>
                    • Error reportado: <em>${err.message}</em>
                `;
            }
        }
    </script>

</body>
</html>
